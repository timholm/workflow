apiVersion: v1
kind: Secret
metadata:
  name: holm-bot-secrets
  namespace: holm-community
type: Opaque
stringData:
  # Replace these with your real tokens before applying
  # Or better: use `kubectl create secret` directly and never commit real values
  MASTODON_ACCESS_TOKEN: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
